app = "shaomin-task-app"
primary_region = "sjc"

[build]

[env]
  DATABASE_URL = "file:/data/dev.db"
  NEXTAUTH_URL = "https://shaomin-task-app.fly.dev"

[[mounts]]
  source = "task_app_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
